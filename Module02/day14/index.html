<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBE Dashboard Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-container">
    <!-- Header -->
    <header class="main-header">
      <div class="logo">CBE Birr</div>
      <nav class="nav-links">
        <a href="#">Transfer</a>
        <a href="#">Deposit</a>
        <a href="#">Payments</a>
      </nav>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">My Accounts</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Toolbar Component (Flexbox) -->
      <div class="toolbar">
        <h2>Account Overview</h2>
        <button class="btn-action">+ Send Money</button>
      </div>

      <!-- Responsive Card Grid -->
      <div class="card-grid">
        <!-- Card 1 (with Absolute Badge) -->
        <div class="stat-card">
          <span class="badge">New</span>
          <h3>Balance</h3>
          <p>ETB 45,000</p>
        </div>
        <!-- Card 2 -->
        <div class="stat-card">
          <h3>Savings</h3>
          <p>ETB 12,500</p>
        </div>
        <!-- Card 3 -->
        <div class="stat-card">
          <h3>Expenses</h3>
          <p>ETB 3,200</p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2026 CBE Online Banking Layout.</p>
    </footer>
  </div>

</body>
</html>
