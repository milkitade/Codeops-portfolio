<!DOCTYPE html>
<html>
    <head>
        <title>form</title>
    </head>
    <body>
        <form>
            <fieldset>
             <legend>Habesha Eatery</legend>   
             <label for="name">Name:</label>
             <input type="name" name="name" id="name" required><br><br>
             <label for="email">Email:</label>
             <input type="email" name="email" id="email" required><br><br>
             <label for="phone">Phone:</label>
             <input type="tel" name="phone" id="phone" required><br><br>
             <label for="date">Date:</label>
             <input type="date" name="date" id="date" required><br><br>
             <label for="party-size">Party Size:</label>
             <input type="number" name="party-size" id="party-size" min="1" max="10" required><br><br>
             <label for="request">Special Requests:</label>
             <textarea name="request" id="request" rows="4" cols="50"></textarea><br><br>
             <input type="submit" value="Submit">
             <input type="reset" value="Reset">
            </fieldset>
        </form>
        <h1>Our Menu </h1>
        <h5>Habesha Eatery menu -prices in Ethiopian Birr(ETB)</h5>
        <table border="1">
            <thead>
                <tr>
                    <th>Dish</th>
                    <th>Description</th>
                    <th>Price(ETB)</th>
                </tr>
                <tr>
                    <th>Doro Wat</th>
                    <td>with egg and injera</td>
                    <td>670 ETB</td>
                </tr>
                 <tr>
                    <th>Kitfo</th>
                    <td>with ayib</td>
                    <td>570 ETB</td>
                </tr>
            </thead>
        </table>

        
    </body>
</html>
